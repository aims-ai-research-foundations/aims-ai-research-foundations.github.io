<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{- $pageTitle := printf "%s · AI Research Foundations" .Title }}
<title>{{ $pageTitle }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="theme-color" content="#361a54">

<meta property="og:title" content="{{ $pageTitle }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ "img/tokenization-challenge-hero.png" | absURL }}">
<link rel="icon" href="{{ "img/logos/logo.svg" | relURL }}" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">

{{- $css := resources.Get "css/challenge.css" | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
