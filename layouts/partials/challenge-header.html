<header class="site-header">
  <div class="wide-container header-inner">
    <a class="challenge-brand" href="{{ .Params.challengeURL | relURL }}" aria-label="AI Research Foundations {{ .Params.challengeName | default "Multilingual Tokenization Challenge" }}, home">
      <span>AI Research Foundations</span>
      <strong>{{ .Params.brandName | default "Tokenization Challenge" }}</strong>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-nav">
      <i data-lucide="menu" aria-hidden="true"></i>
    </button>
    <nav class="primary-nav" id="primary-nav" aria-label="Primary navigation">
      {{- if not .Params.leaderboardURL }}
      {{- else if hasPrefix .Params.leaderboardURL "http" }}
      <a href="{{ .Params.leaderboardURL }}" target="_blank" rel="noopener">Leaderboard</a>
      {{- else }}
      <a href="{{ .Params.leaderboardURL | relURL }}"{{ if eq .Layout "leaderboard" }} aria-current="page"{{ end }}>Leaderboard</a>
      {{- end }}
      <a class="github-link" href="{{ .Params.repoURL }}" target="_blank" rel="noopener"><i data-lucide="github" aria-hidden="true"></i> {{ .Params.repoLinkText | default "Fork on GitHub" }}</a>
    </nav>
  </div>
</header>
