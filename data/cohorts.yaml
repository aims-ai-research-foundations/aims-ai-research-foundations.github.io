# The programme's cohorts, in display order. Shared by the Gallery and
# Testimonials pages so names, flags and order always match.
#
#   id        used for page anchors, testimonials (data/testimonials.yaml)
#             and the photo folder (assets/gallery/<id>/)
#   name      display name, shown after the flag
#   flag      country flag emoji
#   workshop  slug of the matching workshop page (optional): venue, dates
#             and the "About this workshop" link come from there
#
# To add photos for a cohort: scripts/add-photos.sh <id> <folder of photos>

