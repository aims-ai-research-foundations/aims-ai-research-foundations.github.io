kenya-cohort-2:
  - name: "Mr Maurice Wanyonyi"
    role: "AI Champion"
    institution: "University of Embu"
    featured: true
    pull: "In just one week, I moved from viewing AI as abstract and intimidating to understanding its core concepts."
    quote: |-
      Participating in the AI Research Foundations Train-the-Trainer workshop in Nairobi was a truly transformative experience. In just one week, I moved from viewing AI as abstract and intimidating to understanding its core concepts, including large language models, transformer architectures, tokenization, fine-tuning and the role of GPUs.

      What stood out most was the approach to learning. The “Explain It Back” and “Lecture It Back” sessions challenged me to move beyond passive listening and take ownership of the concepts by explaining and teaching them myself. Hands-on activities and group discussions also made complex technical ideas accessible and engaging.

      Equally valuable was the emphasis on Responsible Innovation. Exploring AI alongside questions of ethics, fairness and African data sovereignty reinforced the importance of developing technologies that reflect our contexts, priorities and values.

      I leave with new knowledge, practical teaching strategies and greater confidence to integrate AI responsibly into my teaching and research. I look forward to sharing these insights with my students and preparing them for an AI-enabled future.

      Thank you to AIMS, FATE Foundation, UCL, Google.org and Google DeepMind for investing in Africa’s AI capacity. Asanteni sana! 💜

  - name: "Dr Martha Konje"
    role: "AI Champion"
    institution: "Kibabii University"
    quote: |-
      As one of the AI Champions, taking part in the AI Research Foundations Train-the-Trainer workshop in Nairobi was a rewarding experience, both professionally and personally. What I valued most was the focus on responsible AI. The group discussions on whether a given use of AI was responsible, not responsible or uncertain pushed all of us to think carefully about context, fairness and the communities affected, rather than treating AI as a purely technical subject.

      As a research scientist working on climate change and biodiversity conservation research, I got a clearer picture of how AI can support our research and how to teach it with integrity. I am already bringing these activities into my classes at Kibabii University and into our faculty’s work on integrating AI into STEM curricula. Meeting fellow AI Champions and TAs from across the region was a real highlight and a reminder that we are building this capacity in Africa together.

  - name: "Dr Fortine Mwihaki Mata"
    role: "AI Champion"
    institution: "University of Embu"
    quote: |-
      One of my greatest takeaways was learning how Transformers and attention mechanisms work and how they can be applied beyond traditional AI applications.

      As a cybersecurity researcher and penetration tester, this knowledge has opened exciting possibilities for using AI to analyse network traffic, detect suspicious patterns, identify potential vulnerabilities, and enhance threat intelligence. I now see how Transformer-based models can complement conventional penetration-testing techniques, making security assessments more intelligent and proactive.

      Most importantly, the programme equipped me to integrate these emerging technologies into my teaching, research, and cybersecurity practice while inspiring the next generation of AI innovators.

      I joined to learn AI, but I gained a new perspective on the future of cybersecurity!

