faqs:
  - q: "Can I work on my own?"
    a: "No. Capstone projects are built in pairs, with both people from the same cohort. Your partner also doubles as a study buddy for the remaining courses."
  - q: "Can my partner be from another university?"
    a: "Yes, as long as you are both in the same cohort."
  - q: "When are our deadlines?"
    a: "Your proposal is due no later than two weeks before your cohort's post-workshop period ends, and your implementation by the end of it. See <a href=\"#deadlines\">Deadlines</a> for your cohort's dates."
  - q: "Which dataset can we use?"
    a: "You can use any relevant, well-sourced dataset. This could be an existing public dataset from platforms such as Zindi, Kaggle, or Hugging Face; a dataset you collect manually; or a synthetically generated dataset.</p><p>Make sure you document the dataset in a data card, including its source, purpose, contents, and any relevant limitations or considerations."
  - q: "Do we have to use GitHub?"
    a: "GitHub is highly recommended, as version control is a useful skill, but submissions through Google Drive are also accepted."
  - q: "Who judges the projects?"
    a: "The AIMS South Africa team judges the submitted projects and selects the top three in each cohort, using the judging criteria on this page."
  - q: "What happens when we finish?"
    a: "Completing all the available courses and your capstone project during the post-workshop period is a prerequisite for joining the Community of Practice, where outstanding projects will also be spotlighted."
  - q: "Where can we get help?"
    a: "A dedicated #capstone-project channel will be created on each cohort's Discord server for your capstone questions. Report technical problems in #report-an-issue, and ask questions about the course material in #help-desk."

# "How to create your dataset?" guide (Resources section), shown in a pop-up.
datasetGuide:
  title: "How to Create a Dataset for Your AI Project"
  emoji: "📊"
  subtitle: "A practical, step-by-step guide for beginners"
  intro: "Learn how to source, collect, generate, organise, validate, and document data for an AI project."
  steps:
    - { emoji: "🎯", title: "Define your problem", body: "Identify what your model needs to learn or predict, and what a single example in your dataset should look like." }
    - { emoji: "🔍", title: "Choose how to obtain your data", body: "Explore public datasets from Zindi, Kaggle, Hugging Face and other reputable sources, manual data collection, and synthetic data generation." }
    - { emoji: "📝", title: "Define your data format", body: "Decide on the columns, input features, target labels, and file format, such as CSV or JSON." }
    - { emoji: "🏗️", title: "Collect or create your dataset", body: "Gather examples, generate synthetic samples, and annotate them where necessary." }
    - { emoji: "🧹", title: "Clean and validate your data", body: "Check missing values, duplicates, incorrect labels, inconsistent formats, class imbalance, and data quality." }
    - { emoji: "✂️", title: "Split your dataset", body: "Create training, validation, and test sets, avoiding data leakage." }
    - { emoji: "📋", title: "Create a data card", body: "Document the dataset's source, purpose, collection process, contents, intended uses, limitations, and ethical considerations." }
    - { emoji: "📦", title: "Save and share your dataset", body: "Organise the files, explain how to use them, and include reproducible instructions." }
