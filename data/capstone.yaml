# The challenge: a bold lead, then paragraphs (HTML allowed).
challenge:
  lead: "Done with the courses? Now it's time to build."
  body:
    - "The Capstone Project Hackathon is your chance to team up and build a real-world machine learning solution to a problem in your own context, applying what you've learnt in the courses."
    - "You will apply responsible innovation practices from problem definition to implementation, following the Responsible Innovation Roadmap in <a href=\"https://www.skills.google/paths/3135/course_templates/1557\" target=\"_blank\" rel=\"noopener\">Course 08</a>."

# "Your hackathon journey": five steps. due: shown under the step; proposalLink / submitLink add a link.
journey:
  - { title: "Form a team", body: "Team up with AI Champions and TAs from your cohort." }
  - { title: "Pick a problem", body: "Every great AI project starts with a problem that affects real people, not a solution. Find one that matters where you are, then pick your path." }
  - { title: "Plan and propose", body: "Work through the roadmap in Course 08, then submit your proposal.", due: "Two weeks before your post-workshop period ends", proposalLink: true }
  - { title: "Build and submit", body: "Share your code, notebooks, data card and model card on GitHub or Google Drive.", due: "The last day of your post-workshop period", submitLink: true }
  - { title: "Get recognised", body: "The top three in each cohort are recognised, and finishing unlocks the Community of Practice." }

roadmapIntro: "Every team follows the same eight steps, from the problem you want to solve to a full plan you can share. Course 08 on Google Skills walks you through each one."
proposalContents: "Your proposal brings it together: a problem statement, data collection plan, impact statement, stakeholder analysis, governance blueprint and sustainability plan."
# The eight Course 08 steps; icon is shown on each step.
roadmap:
  - { icon: "focus", title: "Define your problem statement", body: "The problem, who it affects and why it matters in your context." }
  - { icon: "database", title: "Create your data card", body: "Where your data comes from, what it contains and its limitations." }
  - { icon: "globe", title: "Develop your impact statement", body: "The change your solution should make and how you will measure it." }
  - { icon: "users", title: "Conduct a stakeholder analysis", body: "Who is affected by or has influence over your solution." }
  - { icon: "shield-check", title: "Draft your governance blueprint", body: "How risks, privacy and accountability will be managed." }
  - { icon: "leaf", title: "Build your sustainability plan", body: "How the solution can be maintained and grow after the hackathon." }
  - { icon: "presentation", title: "Share your work", body: "Present your plan and solution to others." }
  - { icon: "check", title: "Review your full plan", body: "Check that every part is complete and consistent before you submit." }

teams:
  rules:
    - { icon: "users", title: "Form a team", body: "Every capstone project is built by a team of AI Champions, TAs, or both." }
    - { icon: "network", title: "Stay in your cohort", body: "Everyone in your team comes from the same cohort. Teammates can be from your own university or another university in your cohort." }
    - { icon: "book-open", title: "Study buddies too", body: "Your teammates are also your study buddies: keep each other on track to complete all the available courses before your deadline." }
  note: "You add your team members when you create your capstone proposal."
  tips:
    - "Choose teammates whose skills complement each other, for example someone stronger in coding and someone who knows the problem domain."
    - "AI Champions can work with their selected TAs to distribute the workload effectively."
    - "Agree early on when and how you will meet, and share the eight roadmap steps between you."
    - "Pick a problem you all care about and can find or create data for."

judging:
  - { icon: "globe", title: "Impact", body: "The potential impact of the proposed solution on its target users and their local context." }
  - { icon: "shield-check", title: "Responsible innovation", body: "How well responsible innovation practices are applied to assess the risks, potential harms, fairness, privacy, stakeholders and sustainability of the solution." }
  - { icon: "database", title: "Dataset", body: "Uses a relevant, well-sourced dataset (existing, collected or synthetic) and documents it in a data card." }
  - { icon: "brain-circuit", title: "Model", body: "Uses a relevant model or machine learning technique, with a model card covering its architecture, intended use, training data, evaluation results, limitations and risks." }
  - { icon: "code", title: "Clean coding practices", body: "Clear structure, comments and reproducible steps, whether in Google Colab or Python scripts." }

