overview:
  lead: "During the post-workshop period, you and a partner from your cohort build a machine learning solution to a real-world problem in your own context. You apply responsible innovation practices from problem definition through to implementation, following the roadmap you walked through during the workshop."
  glance:
    - { icon: "users", title: "Who takes part", body: "All AI Champions and TAs in each cohort." }
    - { icon: "groups", title: "Teams", body: "Pairs within the same cohort." }
    - { icon: "focus", title: "Categories", body: "Classification, summarisation, conversational assistant, a combination of two, or your own path." }
    - { icon: "presentation", title: "Deliverables", body: "A capstone project proposal, and a GitHub repository or Google Drive folder with your implementation." }
    - { icon: "smile", title: "Recognition", body: "The top three projects in each cohort are recognised." }
    - { icon: "lightbulb", title: "Support", body: "Contextualised datasets, code recipes, and technical support on Discord." }

workflow:
  - title: "Form your pair"
    body: "Team up with another AI Champion or TA from your cohort and register your pair."
    tag: ""
  - title: "Choose your idea"
    body: "Pick a project category and a real-world problem that matters in your context."
    tag: ""
  - title: "Follow the Responsible Innovation Roadmap"
    body: "Work through the eight steps in Course 08, from your problem statement to your full plan."
    tag: ""
  - title: "Submit your capstone project proposal"
    body: "A document covering your problem statement, data collection plan, impact statement, stakeholder analysis, governance blueprint, sustainability plan and a one-sentence elevator pitch."
    tag: "Two weeks before your post-workshop period ends"
    proposalLink: true   # shows a "Create your proposal" link to the proposal form
  - title: "Build and submit your implementation"
    body: "A GitHub repository or Google Drive folder with your code, Colab notebooks, data card, model card and any other documentation. GitHub is highly recommended, but Google Drive is also accepted."
    tag: "The end of your post-workshop period"
  - title: "Judging and recognition"
    body: "The AIMS South Africa team judges the projects and selects the top three in each cohort. FATE Foundation organises the recognition."
    tag: ""
  - title: "Join the Community of Practice"
    body: "Completing all the available courses and your capstone project unlocks your place in the Community of Practice."
    tag: ""

roadmap:
  - { title: "Define your problem statement", body: "The problem, who it affects and why it matters in your context." }
  - { title: "Create your data card", body: "Where your data comes from, what it contains and its limitations." }
  - { title: "Develop your impact statement", body: "The change your solution should make and how you will measure it." }
  - { title: "Conduct a stakeholder analysis", body: "Who is affected by or has influence over your solution." }
  - { title: "Draft your governance blueprint", body: "How risks, privacy and accountability will be managed." }
  - { title: "Build your sustainability plan", body: "How the solution can be maintained and grow after the hackathon." }
  - { title: "Share your work", body: "Present your plan and solution to others." }
  - { title: "Review your full plan", body: "Check that every part is complete and consistent before you submit." }

teams:
  rules:
    - { icon: "groups", title: "Work in pairs", body: "Every capstone project is built by two people: AI Champions, TAs, or one of each." }
    - { icon: "users", title: "Stay in your cohort", body: "Both partners come from the same cohort. Your partner can be from your own university or another university in your cohort." }
    - { icon: "school", title: "Study buddies too", body: "Your partner is also your study buddy: keep each other on track to complete all the available courses before your deadline." }
  tips:
    - "Choose a partner whose skills complement yours, for example one stronger in coding and one in the problem domain."
    - "Agree early on when and how you will meet, and share the eight roadmap steps between you."
    - "Pick a problem you both care about and can find or create data for."

judging:
  - { icon: "globe", title: "Impact", body: "The potential impact of the proposed solution on its target users and their local context." }
  - { icon: "shield-check", title: "Responsible innovation", body: "How well responsible innovation practices are applied to assess the risks, potential harms, fairness, privacy, stakeholders and sustainability of the solution." }
  - { icon: "database", title: "Dataset", body: "Uses a relevant, well-sourced dataset (existing, collected or synthetic) and documents it in a data card." }
  - { icon: "brain-circuit", title: "Model", body: "Uses a relevant model or machine learning technique, with a model card covering its architecture, intended use, training data, evaluation results, limitations and risks." }
  - { icon: "code", title: "Clean coding practices", body: "Clear structure, comments and reproducible steps, whether in Google Colab or Python scripts." }

